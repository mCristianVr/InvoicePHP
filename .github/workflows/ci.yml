name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: ctype, iconv, mbstring, intl, xml, dom, pdo, pdo_pgsql

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Verify stack integrity
        run: composer ci:verify
